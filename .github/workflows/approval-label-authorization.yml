---
name: approval-label-authorization

on:
  workflow_call:
    inputs:
      approval-label:
        description: Label whose applier must belong to the approval team.
        required: false
        type: string
        default: breaking-change-approved
      team-slug:
        description: GitHub slug of the team allowed to apply or remove the label.
        required: false
        type: string
        default: ansible-staff-eng-leads
      app-client-id:
        description: Client ID of the GitHub App installed in the ansible organization.
        required: false
        type: string
    secrets:
      app-private-key:
        description: Private key for the GitHub App installed in the ansible organization.
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  approval-label-authorization:
    name: approval-label-authorization
    if: github.event.label.name == inputs.approval-label
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        # Let the verification step remove a newly added label if token minting fails.
        continue-on-error: true
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ansible
          permission-members: read

      - name: Verify the label actor belongs to the approval team
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LABEL_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login }}
          TEAM_ORG: ansible
          TEAM_SLUG: ${{ inputs.team-slug }}
          LABEL_NAME: ${{ inputs.approval-label }}
          LABEL_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request_target" ]]; then
            echo "::error::This reusable workflow must be called from a pull_request_target workflow; received '${EVENT_NAME}'."
            exit 1
          fi

          if [[ "${EVENT_ACTION}" != "labeled" && "${EVENT_ACTION}" != "unlabeled" ]]; then
            echo "::error::This reusable workflow must be triggered by a labeled or unlabeled action; received '${EVENT_ACTION}'."
            exit 1
          fi

          if [[ "${EVENT_LABEL}" != "${LABEL_NAME}" ]]; then
            echo "::error::Event label '${EVENT_LABEL}' does not match the configured approval label '${LABEL_NAME}'. Check the caller workflow's approval-label input."
            exit 1
          fi

          restore_unauthorized_label_change() {
            case "${LABEL_ACTION}" in
              labeled)
                if GH_TOKEN="${LABEL_TOKEN}" gh api \
                  --method DELETE \
                  "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/${LABEL_NAME}" \
                  >/dev/null; then
                  echo "::notice::Removed '${LABEL_NAME}' because ${ACTOR}'s team membership could not be authorized."
                  return 0
                else
                  echo "::error::Could not remove '${LABEL_NAME}'. Check that the workflow token has pull-requests: write permission."
                  return 1
                fi
                ;;
              unlabeled)
                if GH_TOKEN="${LABEL_TOKEN}" gh api \
                  --method POST \
                  "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
                  -f "labels[]=${LABEL_NAME}" \
                  >/dev/null; then
                  if current_labels=$(GH_TOKEN="${LABEL_TOKEN}" gh api \
                    --paginate \
                    "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
                    --jq '.[].name') && printf '%s\n' "${current_labels}" | grep -Fqx -- "${LABEL_NAME}"; then
                    echo "::notice::Restored and verified '${LABEL_NAME}' because ${ACTOR}'s team membership could not be authorized."
                    return 0
                  fi

                  echo "::error::Could not verify that '${LABEL_NAME}' was restored."
                  return 1
                else
                  echo "::error::Could not restore '${LABEL_NAME}'. Check that the workflow token has pull-requests: write permission."
                  return 1
                fi
                ;;
            esac
          }

          handle_unverified_label_change() {
            if [[ "${LABEL_ACTION}" == "unlabeled" ]]; then
              if restore_unauthorized_label_change; then
                echo "::notice::The approval label was restored; the check passes because the approval state is intact."
                exit 0
              fi
            else
              restore_unauthorized_label_change || true
            fi

            exit 1
          }

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::Could not create a GitHub App installation token. Check that the caller passes the App client ID and private key and that the App is installed in ${TEAM_ORG} with Members read permission."
            handle_unverified_label_change
          fi

          if ! membership=$(gh api \
            "orgs/${TEAM_ORG}/teams/${TEAM_SLUG}/memberships/${ACTOR}" \
            --jq '.state'); then
            echo "::warning::Could not verify whether ${ACTOR} belongs to ${TEAM_ORG}/${TEAM_SLUG}. Check that the GitHub App is installed in ${TEAM_ORG} with Members read permission and that the actor is a team member."
            handle_unverified_label_change
          fi

          if [[ "${membership}" != "active" ]]; then
            echo "::warning::${ACTOR} is not an active member of ${TEAM_ORG}/${TEAM_SLUG}; they cannot ${LABEL_ACTION} the '${LABEL_NAME}' label."
            handle_unverified_label_change
          fi

          echo "::notice::${ACTOR} is an active member of ${TEAM_ORG}/${TEAM_SLUG}; the '${LABEL_NAME}' label change is authorized."

---
name: "openapi: Post Changelog Fragment Comment"

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the artifact from the enforcement workflow"
        required: false
        type: string
        default: "changelog-fragment-results"

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: "Post changelog fragment PR comment"
    runs-on: ubuntu-26.04
    if: >-
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download results artifact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const resultsPath = 'changelog-results.json';
            const skeletonPath = 'changelog-skeleton.yaml';

            if (!fs.existsSync(resultsPath)) {
              core.info('No changelog-results.json found, skipping comment');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));

            // No spec changes and no fragments — clean up any stale bot comment
            if (!results.has_spec_changes && !results.has_fragment) {
              core.info('No spec changes and no fragments');

              let cleanupPrNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
              if (!cleanupPrNumber) {
                const headSha = context.payload.workflow_run.head_sha;
                const headBranch = context.payload.workflow_run.head_branch;
                const headRepoFullName = context.payload.workflow_run.head_repository?.full_name;
                const { data: prs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100,
                });
                const match = prs.find(pr => pr.head.sha === headSha)
                  || prs.find(pr => pr.head.ref === headBranch && pr.head.repo?.full_name === headRepoFullName);
                if (match) cleanupPrNumber = match.number;
              }

              if (cleanupPrNumber) {
                const marker = '<!-- openapi-changelog-fragment-check -->';
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: cleanupPrNumber,
                  per_page: 100,
                });
                const stale = comments.find(c => c.body?.includes(marker));
                if (stale) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: stale.id,
                  });
                  core.info(`Deleted stale bot comment ${stale.id} on PR #${cleanupPrNumber}`);
                }
              }
              return;
            }

            // Resolve PR number — pull_requests[] is often empty for fork PRs
            let prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;

            if (!prNumber) {
              const headSha = context.payload.workflow_run.head_sha;
              const headBranch = context.payload.workflow_run.head_branch;
              const headRepoFullName = context.payload.workflow_run.head_repository?.full_name;
              core.info(`pull_requests empty, searching for PR by head SHA ${headSha}`);

              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
              });

              const match = prs.find(pr => pr.head.sha === headSha)
                || prs.find(pr => pr.head.ref === headBranch && pr.head.repo?.full_name === headRepoFullName);

              if (match) {
                prNumber = match.number;
                core.info(`Resolved PR #${prNumber} from head SHA/branch lookup`);
              }
            }

            if (!prNumber) {
              core.warning(
                'Could not determine PR number from workflow_run event or API lookup. ' +
                'Changelog fragment results are available in the workflow run artifacts.'
              );
              return;
            }

            const marker = '<!-- openapi-changelog-fragment-check -->';
            let body = `${marker}\n\n`;

            // Case 1: Skeleton generated (spec changes without fragment)
            if (results.skeleton_generated && fs.existsSync(skeletonPath)) {
              const skeleton = fs.readFileSync(skeletonPath, 'utf8');

              body += `## 📝 Changelog Fragment Required\n\n`;
              body += `OpenAPI spec changes were detected, but no changelog fragment was found.\n\n`;
              body += `**Action required:** Copy the skeleton below into \`changelogs/fragments/YYYYMMDD-<description>.yaml\`\n\n`;
              body += `\`\`\`yaml\n`;
              body += skeleton;
              body += `\n\`\`\`\n\n`;
              body += `Replace the placeholders with your actual changes, then commit the file.\n`;
            }
            // Case 2: Validation failed
            else if (results.has_fragment && !results.validation_passed) {
              body += `## ❌ Changelog Fragment Validation Failed\n\n`;

              if (results.validation_errors && Object.keys(results.validation_errors).length > 0) {
                body += `The following validation errors were found:\n\n`;

                for (const [filePath, errors] of Object.entries(results.validation_errors)) {
                  body += `**\`${filePath}\`:**\n`;
                  for (const error of errors) {
                    body += `- ${error}\n`;
                  }
                  body += `\n`;
                }
              } else {
                body += `Fragment validation failed. See workflow logs for details.\n\n`;
              }

              body += `Please fix the validation errors and update your fragment.\n`;
            }
            // Case 3: Everything passed
            else if (results.has_fragment && results.validation_passed) {
              body += `## ✅ Changelog Fragment Validated\n\n`;
              body += `Found and validated the following fragment(s):\n\n`;

              for (const fragmentPath of results.fragment_paths) {
                body += `- \`${fragmentPath}\`\n`;
              }

              body += `\nAll fragments passed schema validation.\n`;
            }
            // Case 4: No spec changes but fragment exists (informational)
            else if (!results.has_spec_changes && results.has_fragment) {
              body += `## ℹ️ Changelog Fragment Detected\n\n`;
              body += `A changelog fragment was found, but no OpenAPI spec changes were detected in this PR.\n\n`;

              for (const fragmentPath of results.fragment_paths) {
                body += `- \`${fragmentPath}\`\n`;
              }
            }

            // Footer with metadata
            if (results.changed_specs && results.changed_specs.length > 0) {
              body += `\n<sub>Changed specs: \`${results.changed_specs.join('`, `')}\`</sub>\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existingComment = comments.find(c => c.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              core.info(`Updated existing comment ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              core.info(`Created new comment on PR #${prNumber}`);
            }
